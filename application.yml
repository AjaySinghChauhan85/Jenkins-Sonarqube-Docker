---
apiVersion: v1
kind: Namespace
metadata:
  name: production-env
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-deployment
  namespace: production-env
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-core
  template:
    metadata:
      labels:
        app: web-core
    spec:
      containers:
      - name: app-container
        image: ajaysingh85/dockerimage:7
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-app-service
  namespace: production-env
spec:
  type: NodePort
  selector:
    app: web-core
  ports:
  - port: 80          # The port accessible inside the cluster
    targetPort: 80    # The port your application container is listening on
    nodePort: 32000   # Exposes the service externally on all K8s nodes at this port
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-app-ingress
  namespace: production-env
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: app.yourdomain.com  # Replace with your actual domain or drop the host line for testing
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-app-service
            port:
              number: 80  # Matches the Service's cluster port
